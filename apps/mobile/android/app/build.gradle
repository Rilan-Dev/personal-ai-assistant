apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
def liveDebugBuild = (findProperty('paaLiveDebug') ?: 'false').toString().toBoolean()
def useEmbeddedDebugBundle = (findProperty('paaUseEmbeddedJsBundle') ?: 'false').toString().toBoolean()
def buildVersionCode = (findProperty('paaBuildVersionCode') ?: System.getenv('PAA_BUILD_VERSION_CODE') ?: '1').toString()
def configuredAcaApiOrigin = System.getenv("EXPO_PUBLIC_ACA_API_ORIGIN")
def normalizeAcaApiOrigin = { String value, boolean development ->
    if (value == null || value.length() == 0 || value.trim() != value || value.contains("?") || value.contains("#")) {
        throw new GradleException("ACA API origin must be a bare origin without whitespace, query, or fragment.")
    }
    def uri
    try {
        uri = new java.net.URI(value)
    } catch (Exception ignored) {
        throw new GradleException("ACA API origin is malformed.")
    }
    def scheme = uri.scheme?.toLowerCase(java.util.Locale.ROOT)
    def host = uri.host?.toLowerCase(java.util.Locale.ROOT)
    if (host == null || uri.rawUserInfo != null || !(uri.rawPath in [null, "", "/"]) ||
        uri.rawQuery != null || uri.rawFragment != null) {
        throw new GradleException("ACA API origin must not contain credentials, path, query, or fragment.")
    }
    def bareHost = host.replace("[", "").replace("]", "")
    def loopback = bareHost == "localhost" || bareHost == "::1" || bareHost ==~ /127(?:\\.\\d{1,3}){3}/
    if (scheme != "https" && !(development && scheme == "http" && loopback)) {
        throw new GradleException("ACA API origin must use HTTPS; HTTP is allowed only for Development loopback.")
    }
    def renderedHost = bareHost.contains(":") ? "[${bareHost}]" : bareHost
    def port = uri.port
    def includePort = port >= 0 && !((scheme == "https" && port == 443) || (scheme == "http" && port == 80))
    return "${scheme}://${renderedHost}${includePort ? ":${port}" : ""}"
}
def acaApiOrigin = configuredAcaApiOrigin == null
    ? "https://aca-unconfigured.invalid"
    : normalizeAcaApiOrigin(configuredAcaApiOrigin, true)

if (liveDebugBuild && useEmbeddedDebugBundle) {
    throw new GradleException('Live debug uses Metro; paaUseEmbeddedJsBundle must remain false.')
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    // Every debug build shares the single .debug package identity. Live mode
    // uses Metro; explicit offline QA bundles JS into that same application.
    if (liveDebugBuild) {
        debuggableVariants = ["debug"]
    } else if (useEmbeddedDebugBundle) {
        debuggableVariants = []
    }

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "dev.rilandev.personalaiassistant"
    defaultConfig {
        applicationId "dev.rilandev.personalaiassistant"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI increments this for installable release-test APK updates.
        versionCode(buildVersionCode.toInteger())
        versionName("0.3." + buildVersionCode)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Keep generated CMake object paths below Windows MAX_PATH for React Native codegen.
        externalNativeBuild {
            cmake {
                arguments '-DCMAKE_OBJECT_PATH_MAX=260'
            }
        }

        // Planned task execution remains disabled in all normal APKs.
        buildConfigField "boolean", "NEXA_REVIEWED_READ_PLAN_ENABLED", "false"
        buildConfigField "String", "NEXA_ACA_API_ORIGIN", "\"${acaApiOrigin}\""
        // Keep offline and Metro-backed QA builds on the same .debug package.
        buildConfigField "boolean", "PAA_USE_EMBEDDED_JS_BUNDLE", "${useEmbeddedDebugBundle}"
        buildConfigField "String", "PAA_SOURCE_REVISION", "\"${System.getenv('PAA_BUILD_SOURCE_REVISION') ?: 'development'}\""
        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Dedicated testing-release certificate. NEVER debug or store keys in Git.
        // GitHub CI provides this keystore and passwords only during build.
        testRelease {
            storeFile file('testing-release.keystore')
            storeType 'pkcs12'
            storePassword (System.getenv("PAA_TEST_APK_STORE_PASSWORD") ?: "unset")
            keyAlias (System.getenv("PAA_TEST_APK_KEY_ALIAS") ?: "paatest")
            keyPassword (System.getenv("PAA_TEST_APK_KEY_PASSWORD") ?: "unset")
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders += [screenAssistServiceLabel: 'Nexa Screen Assist (Debug)',
                launcherNavigationServiceLabel: 'Nexa Launcher Navigation (Debug)']
            // Keep all Development and physical QA sessions on one app. The
            // release application ID remains unchanged.
            applicationIdSuffix '.debug'
            // Development-only: reviewed, low-risk native reads require an
            // explicit owner Run press. Production release stays disabled.
            buildConfigField "boolean", "NEXA_REVIEWED_READ_PLAN_ENABLED", "true"
            signingConfig signingConfigs.debug
        }
        release {
            manifestPlaceholders += [screenAssistServiceLabel: 'Nexa Screen Assist',
                launcherNavigationServiceLabel: 'Nexa Launcher Navigation']
            // Never sign release variants with Android's debug identity.
            // Without a dedicated CI key, assembleRelease stays unsigned.
            if (file('testing-release.keystore').exists()) {
                signingConfig signingConfigs.testRelease
            }
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    externalNativeBuild {
        cmake {
            // The short D: staging path is a Windows-specific optimization.
            // A Windows drive notation becomes a literal D: folder inside the
            // Linux checkout, polluting the source tree with native outputs.
            // Keep the Android Gradle Plugin's default staging location on
            // non-Windows hosts, including the isolated Linux QA builder.
            if (System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('windows')) {
                buildStagingDirectory 'D:/paa-cxx'
            }
        }
    }

    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Every release variant must receive an explicit API origin. Keeping this as
// a task dependency allows ordinary debug builds to use the non-routable
// sentinel while preventing an accidental unconfigured release APK.
tasks.register("validateAcaReleaseApiOrigin") {
    doLast {
        if (configuredAcaApiOrigin == null) {
            throw new GradleException("Set EXPO_PUBLIC_ACA_API_ORIGIN explicitly before building a release variant.")
        }
        normalizeAcaApiOrigin(configuredAcaApiOrigin, false)
    }
}
tasks.configureEach { task ->
    // Expo inlines EXPO_PUBLIC_* values when bundling JS. Include the ACA
    // origin in Gradle's bundle inputs so changing the build environment can
    // never reuse a stale bundle with the previous (or missing) origin.
    if (task.name ==~ /createBundle.*JsAndAssets/) {
        task.inputs.property("expoPublicAcaApiOrigin", acaApiOrigin)
        // The mobile entry imports these workspace packages by source. Expo's
        // default bundle inputs stop at apps/mobile, so without these files a
        // Gradle up-to-date hit can ship stale agent logic in a fresh APK.
        task.inputs.files(
            fileTree("${projectRoot}/../../packages/agent-core/src") { include "**/*.ts" },
            fileTree("${projectRoot}/../../packages/agent-contracts/src") { include "**/*.ts" },
            file("${projectRoot}/../../packages/agent-core/package.json"),
            file("${projectRoot}/../../packages/agent-contracts/package.json")
        ).withPropertyName("paaWorkspaceBundleSources")
    }
    if (task.name == "preReleaseBuild") {
        task.dependsOn("validateAcaReleaseApiOrigin")
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // Pinned Maestro Kotlin models; no desktop driver.
    implementation project(':maestro-portable')
    // Offline speech decoder: Apache-2.0; model downloaded only on explicit opt-in.
    implementation("com.alphacephei:vosk-android:0.3.47")
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    androidTestImplementation("androidx.test.ext:junit:1.3.0")
    androidTestImplementation("androidx.test:runner:1.7.0")
    androidTestImplementation("androidx.test:core:1.7.0")
    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
