appId: dev.rilandev.personalaiassistant
name: Nexa compact first-run setup and three-tab navigation
tags:
  - nexa
  - smoke
  - cloud
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- extendedWaitUntil:
    visible: 'Make your assistant yours.'
    timeout: 30000
- assertVisible: "Microphone & notifications"
- takeScreenshot: nexa-fresh-setup
- tapOn: "Chat"
- assertVisible: "How can I help today?"
- tapOn: "Tools"
- assertVisible: "Tools & permissions"
- tapOn: "Voice"
- assertVisible: "Speak naturally"
- tapOn: "Open settings"
- assertVisible: "Nexa · Settings"
- tapOn: "Tools"
- assertVisible: "Tools & permissions"
- tapOn: "Chat"
- assertVisible: "How can I help today?"
- takeScreenshot: nexa-navigation-three-tabs
