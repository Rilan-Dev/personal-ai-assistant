- assertVisible: "Tools & permissions"
- tapOn: "Voice"
- assertVisible: "Speak naturally"
- tapOn: "Open settings"
- assertVisible: "Nexa · Settings"
- tapOn: "Open permission setup"
- assertVisible: "Make your assistant yours."
- takeScreenshot: nexa-three-tabs-compact-setup
