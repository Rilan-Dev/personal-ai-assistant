appId: dev.rilandev.personalaiassistant
name: Nexa navigation repeated screen taps background resume
tags:
  - nexa
  - smoke
  - cloud
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- extendedWaitUntil:
    visible: 'Make your assistant yours.'
    timeout: 30000
- tapOn: "Chat"
- assertVisible: "How can I help today?"
- tapOn: "Voice"
- assertVisible: "Speak naturally"
- tapOn: "Tools"
- assertVisible: "Tools & permissions"
- tapOn: "Open permission setup"
- extendedWaitUntil:
    visible: 'Make your assistant yours.'
    timeout: 30000
- tapOn: "Chat"
- assertVisible: "How can I help today?"
- pressKey: home
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- assertVisible: "How can I help today?"
- tapOn: "Voice"
- assertVisible: "Live speech-to-speech"
- tapOn: "Tools"
- assertVisible: "Tools & permissions"
- takeScreenshot: nexa-navigation-after-resume
