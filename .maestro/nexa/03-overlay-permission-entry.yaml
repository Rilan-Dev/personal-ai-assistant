appId: dev.rilandev.personalaiassistant
name: Nexa floating-overlay permission entry screen
tags:
  - nexa
  - overlay
  - cloud
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- extendedWaitUntil:
    visible: 'Make your assistant yours.'
    timeout: 30000
- tapOn: "Show optional permissions and features"
- scrollUntilVisible:
    element:
      text: "Floating quick tools"
    direction: DOWN
    timeout: 25000
- assertVisible: "Floating quick tools"
- takeScreenshot: nexa-overlay-permission-before
- tapOn:
    text: "Allow display over apps.*"
- takeScreenshot: nexa-android-overlay-settings-opened
