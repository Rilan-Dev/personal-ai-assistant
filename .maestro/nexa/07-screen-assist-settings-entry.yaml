appId: dev.rilandev.personalaiassistant
name: Nexa Screen Assist Accessibility permission entry
tags:
  - nexa
  - screen
  - cloud
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- extendedWaitUntil:
    visible: 'Make your assistant yours.'
    timeout: 30000
- tapOn: "Show optional permissions and features"
- scrollUntilVisible:
    element: "One-time screen assistance"
    direction: DOWN
    timeout: 25000
- assertVisible: "One-time screen assistance"
- tapOn:
    text: "Open Accessibility.*One-time screen assistance.*"
- takeScreenshot: nexa-android-accessibility-settings-opened
