appId: dev.rilandev.personalaiassistant
name: Nexa encrypted owner task proposals are review-only and remain cancelled
tags:
  - nexa
  - owner-review
  - local-tasks
  - cloud
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: "(?s).*(?:Make your assistant yours\\.|Don.t allow).*"
    timeout: 30000
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- extendedWaitUntil:
    visible: "Make your assistant yours."
    timeout: 30000
- tapOn: "Tools"
- scrollUntilVisible:
    element: "Private task proposals"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible: "Private task proposals"
    timeout: 30000
- scrollUntilVisible:
    element: "Proposal safety: no AI agent, message or phone action runs from a proposal."
    direction: UP
    timeout: 30000
- assertVisible: "Proposal safety: no AI agent, message or phone action runs from a proposal."
- scrollUntilVisible:
    element: "Task to save for review"
    direction: DOWN
    timeout: 30000
- tapOn: "Task to save for review"
- inputText: "Review the ELV quotation and prepare a follow up"
- hideKeyboard
- scrollUntilVisible:
    element: "Save for review"
    direction: DOWN
    timeout: 30000
- tapOn: "Save for review"
- scrollUntilVisible:
    element: "Review the ELV quotation and prepare a follow up"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible: "Review the ELV quotation and prepare a follow up"
    timeout: 30000
- scrollUntilVisible:
    element: "Awaiting owner review · no action started"
    direction: UP
    timeout: 30000
- assertVisible: "Awaiting owner review · no action started"
- takeScreenshot: nexa-local-task-proposal-recorded-no-execution
- tapOn:
    text: "Cancel task proposal: Review the ELV quotation and prepare a follow up"
- extendedWaitUntil:
    visible: "Canceled permanently"
    timeout: 30000
- assertNotVisible: "Awaiting owner review · no action started"
- takeScreenshot: nexa-local-task-proposal-cancelled
- stopApp
- launchApp
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- tapOn: "Tools"
- scrollUntilVisible:
    element: "Canceled permanently"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible: "Canceled permanently"
    timeout: 30000
- assertNotVisible: "Awaiting owner review · no action started"
- takeScreenshot: nexa-local-task-cancelled-after-relaunch
