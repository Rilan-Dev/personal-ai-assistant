appId: dev.rilandev.personalaiassistant
name: Nexa agent performs owner-approved Chrome AI search
tags:
  - nexa
  - agent
  - browser
  - cloud
---
# Chrome startup is an environment precondition, not an agent action.
# Do not confuse this prewarm with the later searched query.
- openLink:
    link: https://www.google.com
    autoVerify: false
    browser: true
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- runFlow:
    when:
      visible: "Stay signed out"
    commands:
      - tapOn: "Stay signed out"
- runFlow:
    when:
      visible: "No thanks"
    commands:
      - tapOn: "No thanks"
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- extendedWaitUntil:
    visible: 'Make your assistant yours.'
    timeout: 30000
- tapOn: "Tools"
- assertVisible: "Tools & permissions"
- scrollUntilVisible:
    element: "App launching"
    direction: DOWN
    timeout: 25000
- tapOn: "App launching"
- tapOn: "Chat"
- assertVisible: "How can I help today?"
# This request enters Nexa's real AgentHarness, not Maestro's browser automation.
- tapOn: "Assistant command"
- inputText: "Open Chrome and search what is AI"
# Android's IME can cover the Chat composer while typing.
# Dismiss the keyboard before tapping Nexa's send control.
- hideKeyboard
- tapOn:
    text: "Send message"
- extendedWaitUntil:
    visible: "Approval needed"
    timeout: 30000
- assertVisible:
    text: "Tool: device.browser_search"
- assertVisible:
    text: ".*what is ai.*"
- takeScreenshot: nexa-browser-user-approved-goal
- tapOn: "Approve once"
- extendedWaitUntil:
    visible: "Resume saved task"
    timeout: 20000
- tapOn: "Resume saved task"
# Observe the actual Chrome page, not a Nexa success toast or intent dispatch.
- extendedWaitUntil:
    visible:
      text: ".*[Ww]hat is [Aa][Ii].*"
    timeout: 65000
- takeScreenshot: nexa-chrome-ai-search-results
# Chrome can keep a delayed activity transition pending after the page loads.
# Release it before the next isolated Nexa flow starts.
- stopApp: com.android.chrome
