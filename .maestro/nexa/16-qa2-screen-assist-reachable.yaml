appId: dev.rilandev.personalaiassistant.debug
name: Debug screen assistant controls are reachable from Tools
tags:
  - nexa
  - screen-assist
  - debug
---
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Wait"
- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Wait"
- runFlow:
    when:
      visible: "Continue to Nexa.*"
    commands:
      - tapOn: "Continue to Nexa.*"
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Wait"
- runFlow:
    when:
      visible: "Collapse"
    commands:
      - tapOn: "Collapse"
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: "Tools"
    timeout: 120000
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Wait"
- tapOn: "Tools"
- scrollUntilVisible:
    element: "Device controls"
    direction: UP
    timeout: 20000
- assertVisible: "Device controls"
# Keep app launching disabled for this focused screen-control test. The test
# needs only visible-control observation and approved named UI actions.
- assertVisible:
    text: "App launching, Open camera.*"
    checked: false
- runFlow:
    when:
      visible:
        text: "Reviewed multi-step screen actions, Tap safe named controls.*"
        checked: false
    commands:
      - tapOn: "Reviewed multi-step screen actions"
- assertVisible:
    text: "Reviewed multi-step screen actions, Tap safe named controls.*"
    checked: true
- runFlow:
    when:
      visible:
        text: "Read safe visible-control metadata, Requires enabled Screen Assist.*"
        checked: false
    commands:
      - tapOn: "Read safe visible-control metadata"
- assertVisible:
    text: "Read safe visible-control metadata, Requires enabled Screen Assist.*"
    checked: true
- scrollUntilVisible:
    element: "Arm one screen read"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
- scrollUntilVisible:
    element: "Review captured text"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
- assertVisible: "Arm one screen read"
- assertVisible: "Review captured text"
# Screen Assist binding is verified after the Maestro flow exits; this flow's
# own Accessibility driver temporarily delays Android's service rebind.
