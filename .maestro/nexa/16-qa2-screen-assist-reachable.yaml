appId: dev.rilandev.personalaiassistant.physicalqa2
name: QA2 screen assistant controls are reachable from Tools
tags:
  - nexa
  - screen-assist
  - qa2
---
- launchApp:
    stopApp: true
- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"
- runFlow:
    when:
      visible: "Continue to Nexa.*"
    commands:
      - tapOn: "Continue to Nexa.*"
- tapOn: "Chat"
- tapOn: "Tools"
- assertVisible: "Device controls"
- scrollUntilVisible:
    element: "Arm one screen read"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
- assertVisible: "Review captured text"
