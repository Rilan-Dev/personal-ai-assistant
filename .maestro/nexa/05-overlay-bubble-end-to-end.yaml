appId: dev.rilandev.personalaiassistant.debug
name: Nexa overlay grant bubble appears on home screen
tags:
  - nexa
  - overlay
  - extended
---
# Recover a pre-existing system dialog before launchApp can wait on its owner.
- runFlow:
    when:
      visible: "Settings isn't responding"
    commands:
      - tapOn: "Close app"
- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Wait"
- launchApp:
    clearState: true
    permissions:
      all: deny
      android.permission.ACCESS_LOCAL_NETWORK: allow
- runFlow:
    when:
      visible: "Settings isn't responding"
    commands:
      # The emulator keeps this stale Accessibility Settings task in ANR; close
      # only the unresponsive system Settings process to uncover Nexa's prompt.
      - tapOn: "Close app"
- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: "(?s).*(?:Make your assistant yours\\.|Don.t allow).*"
    # The debug variant fetches its JavaScript bundle from Metro on cold start.
    # On the x86_64 emulator that first download can exceed one minute.
    timeout: 180000
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: 'Make your assistant yours.'
    timeout: 30000
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Wait"
- tapOn: "Show optional permissions and features"
- scrollUntilVisible:
    element: "Floating quick tools"
    direction: DOWN
    visibilityPercentage: 30
    timeout: 60000
- runFlow:
    when:
      notVisible: "Show floating bubble"
    commands:
      - tapOn:
          text: "Allow display over apps.*"
      # A grant can become visible while the Settings intent is being resolved.
      # Enter the app list only if Android actually opened Settings.
      - runFlow:
          when:
            visible: "Display over other apps"
          commands:
            - scrollUntilVisible:
                element:
                  text: "Nexa AI"
                direction: DOWN
                timeout: 30000
            - assertVisible: "Nexa AI"
            - assertVisible: "Not allowed"
            - takeScreenshot: nexa-overlay-android-app-list
            # The device is kept on one isolated debug installation.
            - tapOn:
                text: "Nexa AI"
                index: 0
            - extendedWaitUntil:
                visible:
                  text: "Allow display over other apps"
                timeout: 25000
            - assertVisible: "0\\.3\\.[0-9]{10}"
            - takeScreenshot: nexa-overlay-permission-before
            # The app-list row is Not allowed, so one tap grants it.
            - tapOn:
                text: "Allow display over other apps"
            - takeScreenshot: nexa-overlay-permission-granted
            - back
            - back
            - launchApp:
                stopApp: false
            - runFlow:
                when:
                  visible: "Don.t allow"
                commands:
                  - tapOn: "Don.t allow"
- scrollUntilVisible:
    element:
      text: "Show floating bubble"
    direction: DOWN
    timeout: 25000
# Presence of Show floating bubble after returning proves Android granted
# the special permission; no bypass or adb app-op injection is used.
- assertVisible: "Show floating bubble"
- tapOn: "Show floating bubble"
- pressKey: home
- extendedWaitUntil:
    visible:
      text: "Nexa assistant.*Tap to expand.*"
    timeout: 25000
- takeScreenshot: nexa-floating-bubble-over-home
- tapOn:
    text: "Nexa assistant.*"
# Expanded overlays initially show the Chat panel. "Talk to Nexa" is
# intentionally in the Voice panel; verify actual tab navigation rather
# than asserting a control in the wrong panel.
- extendedWaitUntil:
    visible:
      text: "How can I help?"
    timeout: 25000
- takeScreenshot: nexa-expanded-overlay-chat
- tapOn: "Voice"
- extendedWaitUntil:
    visible:
      text: "Talk to Nexa.*"
    timeout: 25000
- takeScreenshot: nexa-expanded-overlay-voice
