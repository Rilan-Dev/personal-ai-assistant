appId: dev.rilandev.personalaiassistant
name: Nexa overlay grant bubble appears on home screen
tags:
  - nexa
  - overlay
  - extended
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- extendedWaitUntil:
    visible: 'Make your assistant yours.'
    timeout: 30000
- tapOn: "Show optional permissions and features"
- scrollUntilVisible:
    element: "Floating quick tools"
    direction: DOWN
    timeout: 25000
- runFlow:
    when:
      notVisible: "Enabled"
      visible: "Allow display over apps.*"
    commands:
      - tapOn:
          text: "Allow display over apps.*"
      # Android 11+ opens the app list; the owner must grant the permission in Settings.
      - scrollUntilVisible:
          element:
            text: "Nexa AI"
          direction: DOWN
          timeout: 30000
      - assertVisible: "Nexa AI"
      - takeScreenshot: nexa-overlay-android-app-list
      - tapOn: "Nexa AI"
      - extendedWaitUntil:
          visible:
            text: "Allow display over other apps"
          timeout: 25000
      - takeScreenshot: nexa-overlay-permission-before
      - tapOn:
          text: "Allow display over other apps"
      - takeScreenshot: nexa-overlay-permission-granted
      - back
      - back
      - launchApp:
          stopApp: false
      - runFlow:
          when:
            visible: "Don.t allow"
          commands:
            - tapOn: "Don.t allow"
- scrollUntilVisible:
    element:
      text: "Show floating bubble"
    direction: DOWN
    timeout: 25000
# Presence of Show floating bubble after returning proves Android granted
# the special permission; no bypass or adb app-op injection is used.
- assertVisible: "Show floating bubble"
- tapOn: "Show floating bubble"
- pressKey: home
- extendedWaitUntil:
    visible:
      text: "Nexa assistant.*Tap to expand.*"
    timeout: 25000
- takeScreenshot: nexa-floating-bubble-over-home
- tapOn:
    text: "Nexa assistant.*"
# Expanded overlays initially show the Chat panel. "Talk to Nexa" is
# intentionally in the Voice panel; verify actual tab navigation rather
# than asserting a control in the wrong panel.
- extendedWaitUntil:
    visible:
      text: "How can I help?"
    timeout: 25000
- takeScreenshot: nexa-expanded-overlay-chat
- tapOn: "Voice"
- extendedWaitUntil:
    visible:
      text: "Talk to Nexa.*"
    timeout: 25000
- takeScreenshot: nexa-expanded-overlay-voice
