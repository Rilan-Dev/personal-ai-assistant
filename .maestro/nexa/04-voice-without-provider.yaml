appId: dev.rilandev.personalaiassistant
name: Nexa voice screen safe unconfigured provider state
tags:
  - nexa
  - voice
  - cloud
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- extendedWaitUntil:
    visible: 'Make your assistant yours.'
    timeout: 30000
- tapOn: "Chat"
- assertVisible: "How can I help today?"
- tapOn: "Voice"
- assertVisible: "Speak naturally"
- assertVisible: "Live speech-to-speech"
# React Native renders the prefix and provider value as one Text label.
# Scroll to the live session card and assert the entire absent-provider state.
- scrollUntilVisible:
    element:
      text: ".*Provider for next session: No supported live provider configured.*"
    direction: DOWN
    timeout: 25000
- assertVisible:
    text: ".*Provider for next session: No supported live provider configured.*"
- scrollUntilVisible:
    element:
      text: ".*No live model selected.*"
    direction: DOWN
    timeout: 25000
- assertVisible:
    text: ".*No live model selected.*"
- takeScreenshot: nexa-voice-unconfigured
- tapOn: "Open settings"
- assertVisible: "Nexa · Settings"
- tapOn: "Tools"
- assertVisible: "Tools & permissions"
- tapOn: "Chat"
- assertVisible: "How can I help today?"
