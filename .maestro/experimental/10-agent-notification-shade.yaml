appId: dev.rilandev.personalaiassistant
name: Nexa grants Screen Assist through Android Settings
tags:
  - nexa
  - agent
  - notification
  - experimental
---
# Maestro's active UI automation session suppresses Android Accessibility
# services. This flow grants the real Android setting; the separate post-run
# device check verifies the service is bound after Maestro exits. The live
# notification action is tested only after the runner has released the service.
- launchApp:
    clearState: true
    permissions:
      all: deny
- assertVisible: "Make your assistant yours."
- scrollUntilVisible:
    element: "Show optional permissions and features"
    direction: DOWN
    timeout: 25000
- tapOn: "Show optional permissions and features"
- runFlow:
    when:
      visible: "Explore 6 optional features"
    commands:
      - tapOn: "Show optional permissions and features"
# Overlay permission is checked separately after Maestro, because OEMs expose
# either an inline toggle or a nested details screen for the same grant.
- scrollUntilVisible:
    element: "One-time screen assistance"
    direction: DOWN
    timeout: 25000
- tapOn:
    text: "Open Accessibility.*One-time screen assistance.*"
# Android 17 may open the system full-control consent immediately when this
# app's one-time accessibility shortcut is selected. Confirm it when shown.
- runFlow:
    when:
      visible: "Allow Nexa Screen Assist to have full control of your device\\?"
    commands:
      - tapOn: "Allow"
- runFlow:
    when:
      notVisible: "Use Nexa Screen Assist"
    commands:
      - scrollUntilVisible:
          element: "Nexa Screen Assist"
          direction: DOWN
          timeout: 30000
      - tapOn: "Nexa Screen Assist"
- extendedWaitUntil:
    visible: "Use Nexa Screen Assist"
    timeout: 25000
- runFlow:
    when:
      visible: "Use Nexa Screen Assist"
    commands:
      - tapOn: "Use Nexa Screen Assist"
# Android confirms the accessibility grant in a separate system-owned dialog.
# Accept that explicit confirmation as part of the user-approved test batch.
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- runFlow:
    when:
      visible: "Turn off Nexa Screen Assist\\?"
    commands:
      - tapOn: "Keep on"
# On Android 13+, the Settings app may require the owner to allow restricted
# settings for a sideloaded app. Follow only the system consent screens.
- runFlow:
    when:
      visible: "Restricted setting"
    commands:
      - takeScreenshot: nexa-android-restricted-setting-blocked
      - tapOn: "OK"
      - launchApp:
          stopApp: false
      - scrollUntilVisible:
          element: "Open Nexa app info (restricted settings)"
          direction: DOWN
          timeout: 25000
      - tapOn: "Open Nexa app info (restricted settings)"
      - extendedWaitUntil:
          visible: "App info"
          timeout: 25000
      - tapOn: "More options"
      - tapOn: "Allow restricted settings"
      - runFlow:
          when:
            visible: "Allow"
          commands:
            - tapOn: "Allow"
      - launchApp:
          stopApp: false
      - scrollUntilVisible:
          element: "One-time screen assistance"
          direction: UP
          timeout: 25000
      - tapOn:
          text: "Open Accessibility.*One-time screen assistance.*"
      - runFlow:
          when:
            visible: "Allow Nexa Screen Assist to have full control of your device\\?"
          commands:
            - tapOn: "Allow"
      - runFlow:
          when:
            visible: "Downloaded apps"
          commands:
            - tapOn: "Downloaded apps"
      - runFlow:
          when:
            visible: "Installed apps"
          commands:
            - tapOn: "Installed apps"
      - scrollUntilVisible:
          element: "Nexa Screen Assist"
          direction: DOWN
          timeout: 30000
      - tapOn: "Nexa Screen Assist"
      - runFlow:
          when:
            visible: "Use Nexa Screen Assist"
          commands:
            - tapOn: "Use Nexa Screen Assist"
      - runFlow:
          when:
            visible: "Allow"
          commands:
            - tapOn: "Allow"
# Preserve the Android Settings screen as visible evidence. A separate
# post-Maestro check verifies this grant actually bound ScreenAssistService.
- assertVisible: "Use Nexa Screen Assist"
- takeScreenshot: nexa-screen-assist-owner-setting-enabled
