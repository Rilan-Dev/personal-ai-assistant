appId: dev.rilandev.personalaiassistant.debug
name: Nexa grants Screen Assist through Android Settings
tags:
  - nexa
  - agent
  - notification
  - experimental
---
# Maestro's active UI automation session suppresses Android Accessibility
# services. This flow grants the real Android setting; the separate post-run
# device check verifies the service is bound after Maestro exits. The live
# notification action is tested only after the runner has released the service.
- launchApp:
    stopApp: true
    clearState: false
- extendedWaitUntil:
    visible: "Make your assistant yours."
    timeout: 90000
- scrollUntilVisible:
    element: "Show optional permissions and features"
    direction: DOWN
    timeout: 30000
- tapOn: "Show optional permissions and features"
- scrollUntilVisible:
    element: "Hide optional features"
    direction: DOWN
    timeout: 30000
- assertVisible: "Hide optional features"
# Overlay permission is checked separately after Maestro, because OEMs expose
# different system grant surfaces.
- scrollUntilVisible:
    element: "One-time screen assistance"
    direction: UP
    timeout: 30000
- tapOn:
    text: "Open Accessibility.*One-time screen assistance.*"
# Android 17 may open the system full-control consent immediately when this
# app's one-time accessibility shortcut is selected. Confirm it when shown.
- runFlow:
    when:
      visible: "Allow Nexa Screen Assist( \\(Debug\\))? to have full control of your device\\?"
    commands:
      - tapOn: "Allow"
- runFlow:
    when:
      notVisible: "Use Nexa Screen Assist \\(Debug\\)"
    commands:
      - scrollUntilVisible:
          element: "Nexa Screen Assist \\(Debug\\)"
          direction: DOWN
          timeout: 30000
      - tapOn: "Nexa Screen Assist \\(Debug\\)"
- extendedWaitUntil:
    visible: "Use Nexa Screen Assist \\(Debug\\)"
    timeout: 25000
- runFlow:
    when:
      visible:
        id: "android:id/switch_widget"
        checked: true
    commands:
      - tapOn:
          id: "android:id/switch_widget"
          checked: true
- runFlow:
    when:
      visible: "Turn off Nexa Screen Assist( \\(Debug\\))?\\?"
    commands:
      - tapOn: "Turn off"
- runFlow:
    when:
      visible: "Stop Nexa Screen Assist( \\(Debug\\))?\\?"
    commands:
      - tapOn: "Stop"
- runFlow:
    when:
      visible:
        id: "android:id/switch_widget"
        checked: false
    commands:
      - tapOn:
          id: "android:id/switch_widget"
          checked: false
- runFlow:
    when:
      visible: "Allow Nexa Screen Assist( \\(Debug\\))? to have full control of your device\\?"
    commands:
      - tapOn: "Allow"
# Android confirms the accessibility grant in a separate system-owned dialog.
# Accept that explicit confirmation as part of the user-approved test batch.
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- assertVisible:
    id: "android:id/switch_widget"
    checked: true
# On Android 13+, the Settings app may require the owner to allow restricted
# settings for a sideloaded app. Follow only the system consent screens.
- runFlow:
    when:
      visible: "Restricted setting"
    commands:
      - takeScreenshot: nexa-android-restricted-setting-blocked
      - tapOn: "OK"
      - launchApp:
          stopApp: false
      - scrollUntilVisible:
          element: "Open Nexa app info (restricted settings)"
          direction: DOWN
          timeout: 25000
      - tapOn: "Open Nexa app info (restricted settings)"
      - extendedWaitUntil:
          visible: "App info"
          timeout: 25000
      - tapOn: "More options"
      - tapOn: "Allow restricted settings"
      - runFlow:
          when:
            visible: "Allow"
          commands:
            - tapOn: "Allow"
      - launchApp:
          stopApp: false
      - scrollUntilVisible:
          element: "One-time screen assistance"
          direction: UP
          timeout: 25000
      - tapOn:
          text: "Open Accessibility.*One-time screen assistance.*"
      - runFlow:
          when:
            visible: "Allow Nexa Screen Assist( \\(Debug\\))? to have full control of your device\\?"
          commands:
            - tapOn: "Allow"
      - runFlow:
          when:
            visible: "Downloaded apps"
          commands:
            - tapOn: "Downloaded apps"
      - runFlow:
          when:
            visible: "Installed apps"
          commands:
            - tapOn: "Installed apps"
      - scrollUntilVisible:
          element: "Nexa Screen Assist \\(Debug\\)"
          direction: DOWN
          timeout: 30000
      - tapOn: "Nexa Screen Assist \\(Debug\\)"
      - runFlow:
          when:
            visible:
              id: "android:id/switch_widget"
              checked: false
          commands:
            - tapOn:
                id: "android:id/switch_widget"
                checked: false
      - runFlow:
          when:
            visible: "Allow"
          commands:
            - tapOn: "Allow"
      - assertVisible:
          id: "android:id/switch_widget"
          checked: true
# Preserve the system-owned Settings UI as evidence. Its label may change
# immediately after the toggle, so the post-Maestro ADB check verifies the
# actual secure setting and bound ScreenAssistService state.
- takeScreenshot: nexa-screen-assist-owner-setting-enabled
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 3000
