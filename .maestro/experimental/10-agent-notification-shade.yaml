appId: dev.rilandev.personalaiassistant.debug
name: Nexa grants Screen Assist through Android Settings
tags:
  - nexa
  - agent
  - notification
  - experimental
---
# Maestro's active UI automation session suppresses Android Accessibility
# services. This flow grants the real Android setting; the separate post-run
# device check verifies the service is bound after Maestro exits. Restart Nexa
# so the Setup path does not inherit a deep Tools scroll position from QA flows.
- launchApp:
    stopApp: true
    clearState: false
- runFlow:
    when:
      visible: "Pixel Launcher.*responding"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: "(?s).*(?:How can I help today\\?|Make your assistant yours\\.|Don.t allow|Nexa · Tools).*"
    timeout: 180000
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- runFlow:
    when:
      visible: "How can I help today\\?"
    commands:
      - tapOn: "Tools"
- runFlow:
    when:
      visible: "Make your assistant yours\\."
    commands:
      - tapOn: "Tools"
- extendedWaitUntil:
    visible: "Nexa · Tools"
    timeout: 30000
- scrollUntilVisible:
    element: "Open permission setup"
    direction: UP
    timeout: 30000
- tapOn:
    text: "Open permission setup"
    point: "50%,50%"
- extendedWaitUntil:
    visible: "Make your assistant yours."
    timeout: 90000
- scrollUntilVisible:
    element: "Show optional permissions and features"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Show optional permissions and features"
    point: "50%,50%"
- scrollUntilVisible:
    element: "One-time screen assistance"
    direction: DOWN
    timeout: 30000
- assertVisible: "One-time screen assistance"
# Overlay permission is checked separately after Maestro, because OEMs expose
# different system grant surfaces.
- scrollUntilVisible:
    element: "Open Accessibility.*One-time screen assistance.*"
    direction: DOWN
    timeout: 180000
- tapOn:
    text: "Open Accessibility.*One-time screen assistance.*"
    point: "50%,50%"
# Android 17 may open the system full-control consent immediately when this
# app's one-time accessibility shortcut is selected. Confirm it when shown.
- runFlow:
    when:
      visible: "Allow Nexa Screen Assist (Debug) to have full control of your device\\?"
    commands:
      - tapOn: "Allow"
- runFlow:
    when:
      notVisible: "Use Nexa Screen Assist (Debug)"
    commands:
      - scrollUntilVisible:
          element: "Nexa Screen Assist (Debug)"
          # The physical Infinix lists downloaded services alphabetically;
          # Nexa appears below the initial page of accessibility apps.
          direction: DOWN
          timeout: 30000
      - tapOn: "Nexa Screen Assist (Debug)"
- extendedWaitUntil:
    visible: "Use Nexa Screen Assist (Debug)"
    timeout: 25000
- runFlow:
    when:
      visible:
        id: "android:id/switch_widget"
        checked: true
    commands:
      - tapOn:
          id: "android:id/switch_widget"
          checked: true
- runFlow:
    when:
      visible: "Turn off Nexa Screen Assist (Debug)\\?"
    commands:
      - tapOn: "Turn off"
- runFlow:
    when:
      visible: "Stop Nexa Screen Assist (Debug)\\?"
    commands:
      - tapOn: "Stop"
- runFlow:
    when:
      visible:
        id: "android:id/switch_widget"
        checked: false
    commands:
      - tapOn:
          id: "android:id/switch_widget"
          checked: false
- runFlow:
    when:
      visible: "Allow Nexa Screen Assist (Debug) to have full control of your device\\?"
    commands:
      - tapOn: "Allow"
# Android confirms the accessibility grant in a separate system-owned dialog.
# Accept that explicit confirmation as part of the user-approved test batch.
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- assertVisible:
    id: "android:id/switch_widget"
    checked: true
# On Android 13+, the Settings app may require the owner to allow restricted
# settings for a sideloaded app. Follow only the system consent screens.
- runFlow:
    when:
      visible: "Restricted setting"
    commands:
      - takeScreenshot: nexa-android-restricted-setting-blocked
      - tapOn: "OK"
      - launchApp:
          stopApp: false
      - scrollUntilVisible:
          element: "Open Nexa app info (restricted settings)"
          direction: DOWN
          timeout: 25000
      - tapOn:
          text: "Open Nexa app info (restricted settings)"
          point: "50%,50%"
      - extendedWaitUntil:
          visible: "App info"
          timeout: 25000
      - tapOn: "More options"
      - tapOn: "Allow restricted settings"
      - runFlow:
          when:
            visible: "Allow"
          commands:
            - tapOn: "Allow"
      - launchApp:
          stopApp: false
      - scrollUntilVisible:
          element: "One-time screen assistance"
          direction: UP
          timeout: 25000
      - tapOn:
          text: "Open Accessibility.*One-time screen assistance.*"
          point: "50%,50%"
      - runFlow:
          when:
            visible: "Allow Nexa Screen Assist (Debug) to have full control of your device\\?"
          commands:
            - tapOn: "Allow"
      - runFlow:
          when:
            visible: "Downloaded apps"
          commands:
            - tapOn: "Downloaded apps"
      - runFlow:
          when:
            visible: "Installed apps"
          commands:
            - tapOn: "Installed apps"
      - scrollUntilVisible:
          element: "Nexa Screen Assist (Debug)"
          direction: DOWN
          timeout: 30000
      - tapOn: "Nexa Screen Assist (Debug)"
      - runFlow:
          when:
            visible:
              id: "android:id/switch_widget"
              checked: false
          commands:
            - tapOn:
                id: "android:id/switch_widget"
                checked: false
      - runFlow:
          when:
            visible: "Allow"
          commands:
            - tapOn: "Allow"
      - assertVisible:
          id: "android:id/switch_widget"
          checked: true
# Preserve the system-owned Settings UI as evidence. Its label may change
# immediately after the toggle, so the post-Maestro ADB check verifies the
# actual secure setting and bound ScreenAssistService state.
- takeScreenshot: nexa-screen-assist-owner-setting-enabled
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 3000
