appId: dev.rilandev.personalaiassistant.physicalqa2
name: Nexa ambiguous Mom message asks channel and displays exact draft without sending
tags:
  - nexa
  - messaging
  - owner-review
  - experimental
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Chat"
    timeout: 90000
- tapOn: "Chat"
- assertVisible: "How can I help today?"
- tapOn: "Assistant command"
- inputText: "Hey Nexa Send Message to my Mom That I am in the meeting i will call you later"
- hideKeyboard
- tapOn:
    text: "Send message"
- scrollUntilVisible:
    element:
      text: "Exact draft: I am in the meeting i will call you later"
    direction: DOWN
    visibilityPercentage: 50
    timeout: 60000
- assertVisible: "Message app & recipient review"
- extendedWaitUntil:
    visible: "Exact draft: I am in the meeting i will call you later"
    timeout: 30000
- assertVisible: "Requested recipient: Mom"
- assertVisible: "Exact draft: I am in the meeting i will call you later"
- scrollUntilVisible:
    element: "Messaging app decision"
    direction: DOWN
    visibilityPercentage: 50
    timeout: 30000
- assertVisible: "Messaging app decision"
- scrollUntilVisible:
    element:
      text: "Discard message review — do not send"
    direction: DOWN
    timeout: 30000
- assertVisible: "Discard message review — do not send"
- takeScreenshot: nexa-ambiguous-messenger-explicit-owner-choice
