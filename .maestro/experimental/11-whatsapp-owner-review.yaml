appId: dev.rilandev.personalaiassistant.debug
name: Nexa WhatsApp owner request prepares local review without sending
tags:
  - nexa
  - whatsapp
  - owner-review
  - cloud
---
- launchApp:
    stopApp: false
    clearState: false
- extendedWaitUntil:
    visible: "Chat"
    # Reuse the live debug runtime; this check must not wait through a cold bundle load.
    timeout: 30000
- tapOn: "Chat"
- assertVisible: "Assistant command"
- tapOn: "Assistant command"
- inputText: 'Send a WhatsApp message to my mom "Nexa QA local review only"'
- hideKeyboard
- tapOn:
    text: "Send message"
# The live app routes the request to Tools; verify both the local no-send status
# and the unique test text, not merely the selected tab.
- tapOn: "Tools"
- extendedWaitUntil:
    visible: "Nexa · Tools"
    timeout: 30000
- assertVisible:
    text: "Requested contact: mom.*Nothing was sent.*"
- assertVisible: "Draft text: Nexa QA local review only"
- takeScreenshot: nexa-owner-whatsapp-local-preview-no-send
