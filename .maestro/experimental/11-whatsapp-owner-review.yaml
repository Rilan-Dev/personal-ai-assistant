appId: dev.rilandev.personalaiassistant
name: Nexa WhatsApp owner request prepares local review without sending
tags:
  - nexa
  - whatsapp
  - owner-review
  - cloud
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- assertVisible: "Make your assistant yours."
- tapOn: "Chat"
- assertVisible: "How can I help today?"
- tapOn: "Assistant command"
- inputText: 'Send a WhatsApp message to my mom "I will call you later"'
- hideKeyboard
- tapOn:
    text: "Send message"
# Route to the private Tools review first. The contact-preview area is
# intentionally below device controls; Maestro does not auto-scroll for
# extendedWaitUntil. Do not pass merely because the Tools tab appeared.
- tapOn: "Tools"
- extendedWaitUntil:
    visible: "Nexa · Tools"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Requested contact: mom.*Nothing was sent.*"
    direction: DOWN
    timeout: 30000
- assertVisible:
    text: "Requested contact: mom.*Nothing was sent.*"
- takeScreenshot: nexa-owner-whatsapp-local-preview-no-send
