appId: dev.rilandev.personalaiassistant.debug
name: Nexa user-requested named input box stays reviewed and unsent
tags:
  - nexa
  - text-entry
  - owner-review
  - experimental
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Chat"
    timeout: 30000
- tapOn: "Chat"
- assertVisible: "How can I help today?"
- tapOn: "Assistant command"
- inputText: "Hey Nexa type project update into the Search box"
- hideKeyboard
- tapOn:
    text: "Send message"
- extendedWaitUntil:
    visible: "Nexa · Tools"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Review text entry into another app"
    direction: DOWN
    timeout: 30000
- assertVisible: "Target input: Search"
- assertVisible: "Exact text: project update"
- scrollUntilVisible:
    element:
      text: "Prepare approved text entry"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Discard text"
    direction: DOWN
    timeout: 30000
- takeScreenshot: nexa-reviewed-generic-text-input
