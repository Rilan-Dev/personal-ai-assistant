appId: dev.rilandev.personalaiassistant.debug
name: Enable Nexa debug Accessibility services in Android Settings
tags:
  - nexa
  - physical
  - qa-preflight
  - no-external-action
---
- launchApp:
    stopApp: false
    clearState: false
    permissions:
      all: allow
- runFlow:
    when:
      visible: "Notifications"
    commands:
      - pressKey: BACK
- runFlow:
    when:
      visible: "Continue to Nexa.*"
    commands:
      - tapOn: "Continue to Nexa.*"
- extendedWaitUntil:
    visible: "Tools"
    timeout: 60000
- tapOn: "Tools"
- extendedWaitUntil:
    visible: "Nexa · Tools"
    timeout: 10000
- scrollUntilVisible:
    element: "Open Android Accessibility Settings button"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 50
- tapOn: "Open Android Accessibility Settings button"
# Infinix Settings remembers the last service detail. Return to the list before
# looking for Downloaded Apps regardless of which debug service opened directly.
- runFlow:
    when:
      visible: "Use Nexa Screen Assist \\(Debug\\)"
    commands:
      - pressKey: BACK
- runFlow:
    when:
      visible: "Use Nexa Launcher Navigation \\(Debug\\)"
    commands:
      - pressKey: BACK
- runFlow:
    when:
      visible: "Use Nexa.*"
    commands:
      - pressKey: BACK
- extendedWaitUntil:
    visible: "Accessibility.*"
    timeout: 20000
- runFlow:
    when:
      visible: "Downloaded Apps"
    commands:
      - tapOn: "Downloaded Apps"
- scrollUntilVisible:
    element: "Nexa Screen Assist (Debug)"
    direction: DOWN
    timeout: 20000
- tapOn: "Nexa Screen Assist (Debug)"
- runFlow:
    when:
      visible: "Allow Nexa Screen Assist \\(Debug\\) to have full control of your device.*"
    commands:
      - tapOn: "^Allow$"
- extendedWaitUntil:
    visible: "Use Nexa Screen Assist \\(Debug\\)"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "android:id/switch_widget"
        checked: true
    commands:
      - tapOn:
          id: "android:id/switch_widget"
          checked: true
      - runFlow:
          when:
            visible: "Stop Nexa Screen Assist \\(Debug\\).*"
          commands:
            - tapOn: "^Stop$"
      - runFlow:
          when:
            visible: "Turn off.*"
          commands:
            - tapOn: "^Turn off$"
      - extendedWaitUntil:
          visible:
            id: "android:id/switch_widget"
            checked: false
          timeout: 20000
- runFlow:
    when:
      visible:
        id: "android:id/switch_widget"
        checked: false
    commands:
      - tapOn:
          id: "android:id/switch_widget"
          checked: false
- runFlow:
    when:
      visible: "Allow Nexa Screen Assist \\(Debug\\) to have full control of your device.*"
    commands:
      - tapOn: "^Allow$"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "^Allow$"
- assertVisible:
    id: "android:id/switch_widget"
    checked: true
- pressKey: BACK
- scrollUntilVisible:
    element: "Nexa Launcher Navigation (Debug)"
    direction: UP
    timeout: 20000
- tapOn: "Nexa Launcher Navigation (Debug)"
- extendedWaitUntil:
    visible: "Use Nexa Launcher Navigation \\(Debug\\)"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "android:id/switch_widget"
        checked: true
    commands:
      - tapOn:
          id: "android:id/switch_widget"
          checked: true
      - runFlow:
          when:
            visible: "Stop Nexa Launcher Navigation \\(Debug\\).*"
          commands:
            - tapOn: "^Stop$"
      - runFlow:
          when:
            visible: "Turn off.*"
          commands:
            - tapOn: "^Turn off$"
      - extendedWaitUntil:
          visible:
            id: "android:id/switch_widget"
            checked: false
          timeout: 20000
- runFlow:
    when:
      visible:
        id: "android:id/switch_widget"
        checked: false
    commands:
      - tapOn:
          id: "android:id/switch_widget"
          checked: false
- runFlow:
    when:
      visible: "Allow Nexa Launcher Navigation \\(Debug\\) to have full control of your device.*"
    commands:
      - tapOn: "^Allow$"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "^Allow$"
- assertVisible:
    id: "android:id/switch_widget"
    checked: true
- pressKey: BACK
