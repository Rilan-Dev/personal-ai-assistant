appId: dev.rilandev.personalaiassistant.physicalqa2
name: Grant QA2 runtime permissions, controls, and overlay
tags:
  - nexa
  - physical
  - qa-preflight
  - no-external-action
---
# Keep QA2 data intact. Maestro grants declared runtime permissions. Android
# owns the overlay control, so this flow changes it only through visible Settings.
- launchApp:
    stopApp: true
    clearState: false
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Tools tab"
    timeout: 60000
- tapOn:
    text: "Tools tab"
- extendedWaitUntil:
    visible: "Nexa · Tools"
    timeout: 10000
- extendedWaitUntil:
    visible: "Device controls"
    timeout: 30000
# Enable the local capabilities needed by the QA scenarios. Each actual
# device action still presents its separate owner confirmation.
- runFlow:
    when:
      visible:
        text: "App launching, Open camera.*"
        checked: false
    commands:
      - tapOn: "App launching"
- runFlow:
    when:
      visible:
        text: "Reviewed multi-step screen actions, Tap safe named controls.*"
    commands:
      - runFlow:
          when:
            visible:
              text: "Reviewed multi-step screen actions, Tap safe named controls.*"
              checked: false
          commands:
            - tapOn: "Reviewed multi-step screen actions"
      - assertVisible:
          text: "Reviewed multi-step screen actions, Tap safe named controls.*"
          checked: true
- runFlow:
    when:
      visible:
        text: "Read safe visible-control metadata, Requires enabled Screen Assist.*"
    commands:
      - runFlow:
          when:
            visible:
              text: "Read safe visible-control metadata, Requires enabled Screen Assist.*"
              checked: false
          commands:
            - tapOn: "Read safe visible-control metadata"
      - assertVisible:
          text: "Read safe visible-control metadata, Requires enabled Screen Assist.*"
          checked: true
- assertVisible:
    text: "App launching, Open camera.*"
    checked: true
- scrollUntilVisible:
    element: "Open permission setup"
    direction: UP
    timeout: 20000
- tapOn: "Open permission setup"
- extendedWaitUntil:
    visible: "Nexa · Setup"
    timeout: 30000
- scrollUntilVisible:
    element: "Make your assistant yours."
    direction: UP
    timeout: 10000
- assertVisible: "Make your assistant yours."
- tapOn: "Show optional permissions and features"
- scrollUntilVisible:
    element: "(Show|Refresh) floating bubble|Allow display over apps.*"
    direction: DOWN
    timeout: 20000
- runFlow:
    when:
      visible:
        text: "Allow display over apps.*"
        enabled: true
    commands:
      - tapOn:
          text: "Allow display over apps.*"
      - runFlow:
          when:
            visible: "Nexa AI"
          commands:
            - tapOn: "Nexa AI"
      - extendedWaitUntil:
          visible: "Allow display over other apps"
          timeout: 20000
      - runFlow:
          when:
            visible:
              id: "android:id/switch_widget"
              checked: false
          commands:
            - tapOn:
                id: "android:id/switch_widget"
                checked: false
      - assertVisible:
          id: "android:id/switch_widget"
          checked: true
      - pressKey: BACK
      - pressKey: BACK
      - launchApp:
          stopApp: false
          clearState: false
- tapOn:
    text: "Tools tab"
- extendedWaitUntil:
    visible: "Nexa · Tools"
    timeout: 10000
