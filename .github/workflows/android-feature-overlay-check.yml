name: Android overlay feature - native verification

on:
  push:
    branches: [feature/nexa-overlay-first-controls-20261101]
    paths:
      - 'apps/mobile/**'
      - 'scripts/test/**'
      - '.github/workflows/android-feature-overlay-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$sdkmanager_path"
          "$sdkmanager_path" --install "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Verify source and types
        run: |
          npm test
          npm run typecheck
      - name: Prepare ephemeral debug signing key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keytool -genkeypair -keystore apps/mobile/android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Debug Android Test,O=PAA,C=US" -noprompt
      - name: Enable hardware accelerated emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android native instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: cd apps/mobile/android && ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Compile Android debug APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Save diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexa-overlay-feature-native-test-reports
          path: apps/mobile/android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 7
