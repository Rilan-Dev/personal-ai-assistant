name: Android debug compile
on:
  push:
  pull_request:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub ubuntu-latest already contains Android command-line tools.
      # setup-android@v3 currently requests obsolete SDK "tools" and fails
      # before any app compilation; install the required components directly.
      - name: Ensure Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          echo "Android SDK root: $ANDROID_HOME"
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$sdkmanager_path"
          "$sdkmanager_path" --install "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      # Generated fresh for each CI job; never commit signing keys.
      - name: Generate temporary debug signing key
        run: |
          keytool -genkeypair -v -keystore apps/mobile/android/app/debug.keystore             -alias androiddebugkey -storepass android -keypass android             -keyalg RSA -keysize 2048 -validity 365             -dname "CN=Android Debug,O=Personal AI Assistant,C=US" -noprompt
      - name: Compile Android app and Kotlin native bridge
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon
      # Debug-only, ephemeral signing. This is NOT a release APK.
      - name: Attach debug APK for owner device testing
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-assistant-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
