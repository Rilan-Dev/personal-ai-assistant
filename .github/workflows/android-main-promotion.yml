name: Android main promotion - test and signed APK

# Explicit owner-started test and signed APK build only.
# Syncing Development and main does not automatically release.
on:
  workflow_dispatch:
concurrency:
  group: android-main-promotion-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  release-test:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$sdkmanager_path"
          "$sdkmanager_path" --install "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Verify application source
        run: |
          npm test
          npm run typecheck
      # One source revision, one GitHub Actions runner: native tests MUST pass
      # before spending CPU minutes to build a signed release APK.
      - name: Load permanent Nexa release signer (required, never regenerate)
        shell: bash
        env:
          NEXA_RELEASE_KEYSTORE_B64: ${{ secrets.NEXA_RELEASE_KEYSTORE_B64 }}
          NEXA_RELEASE_STORE_PASSWORD: ${{ secrets.NEXA_RELEASE_STORE_PASSWORD }}
          NEXA_RELEASE_KEY_PASSWORD: ${{ secrets.NEXA_RELEASE_KEY_PASSWORD }}
        run: bash scripts/signing/load-ci-release-key.sh
      - name: Prepare temporary Android debug signing key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keytool -genkeypair -keystore apps/mobile/android/app/debug.keystore             -alias androiddebugkey -storepass android -keypass android             -keyalg RSA -keysize 2048 -validity 365             -dname "CN=Debug Android Test,O=PAA,C=US" -noprompt
      - name: Enable hardware accelerated emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pin release version and source for emulator and distributable APK
        shell: bash
        run: |
          set -euo pipefail
          echo "PAA_BUILD_VERSION_CODE=$(bash scripts/signing/release-version-code.sh)" >> "$GITHUB_ENV"
          echo "PAA_BUILD_SOURCE_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Gate release on native Keystore, permission and action-replay tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          # One persistent bash process runs native tests, assembles the signed
          # release APK, then captures its real installed UI.
          script: bash scripts/ci/run-nexa-emulator-acceptance.sh
      - name: Upload Android emulator screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexa-ui-screenshots
          path: artifacts/nexa-ui-screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload instrumentation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-main-promotion-instrumentation-reports
          path: apps/mobile/android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 7
      - name: Assemble optimized signed Android release variant
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          : "${PAA_BUILD_SOURCE_REVISION:?source revision was not pinned}"
          : "${PAA_BUILD_VERSION_CODE:?release version was not pinned}"
          test "$PAA_BUILD_VERSION_CODE" -lt 2100000000
          # Gradle reuses the release APK already installed on the emulator.
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify release signature matches permanent Nexa identity
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/signing/verify-release-apk.sh
          echo "$GITHUB_SHA" > release-test-source-sha.txt
          echo "Build source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Signed using pinned Nexa Android release certificate." >> "$GITHUB_STEP_SUMMARY"
          cat release-test-sha256.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable release-test APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-assistant-release-test-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            release-test-sha256.txt
            release-test-verification.txt
            release-test-source-sha.txt
            release-test-signing-certificate.txt
          if-no-files-found: error
          retention-days: 14
