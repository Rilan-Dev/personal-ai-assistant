name: Nexa messaging native feature QA (manual owner command)

# No automatic pushes, no release signer, no provider API keys.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-messaging-qa:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 29 &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'Rilan-Dev' &&
       github.event.comment.author_association == 'OWNER' &&
       (github.event.comment.body == '/nexa-message native-qa' ||
        github.event.comment.body == '/nexa-autonomy native-qa'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.comment.body == '/nexa-autonomy native-qa' && 'fix/nexa-autonomous-tool-qa-20261105' || 'feature/nexa-message-routing-input-20261104' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$sdkmanager_path"
          "$sdkmanager_path" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Install locked dependencies and verify source + type safety
        run: |
          npm ci
          npm test
          npm run typecheck
      - name: Create disposable Android debug signing identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keytool -genkeypair -keystore apps/mobile/android/app/debug.keystore             -alias androiddebugkey -storepass android -keypass android             -keyalg RSA -keysize 2048 -validity 365             -dname "CN=Nexa Feature Test,O=Personal AI Assistant,C=US" -noprompt
      - name: Enable hardware-accelerated emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute Android native instrumentation on installed emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          # The emulator runner executes each line separately. Use ONE shell
          # command so the Gradle directory and QA state remain consistent.
          script: bash scripts/acceptance/nexa-message-feature-qa.sh
      - name: Install Maestro CLI for user-visible messaging smoke test
        shell: bash
        run: curl -fsSL https://get.maestro.mobile.dev | bash
      - name: Run Nexa message routing and generic input review on Maestro Cloud
        shell: bash
        env:
          MAESTRO_CLOUD_API_KEY: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          MAESTRO_DISABLE_UPDATE_CHECK: "true"
          MAESTRO_CLI_NO_ANALYTICS: "true"
        run: |
          set -euo pipefail
          # React Native debug APK requires Metro and is not self-contained.
          # The feature script creates a bundled, disposable-key-signed APK.
          test -s apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          mkdir -p "$RUNNER_TEMP/nexa-input-qa-flows"
          cp .maestro/experimental/12-message-app-chooser.yaml "$RUNNER_TEMP/nexa-input-qa-flows/"
          cp .maestro/experimental/13-reviewed-generic-text-field.yaml "$RUNNER_TEMP/nexa-input-qa-flows/"
          MAESTRO_CLOUD_API_KEY="$(printf '%s' "$MAESTRO_CLOUD_API_KEY" | tr -d '\r\n')"
          if [[ -z "$MAESTRO_CLOUD_API_KEY" || "$MAESTRO_CLOUD_API_KEY" == *[[:space:]]* ]]; then
            echo "::error::Maestro API key is not configured safely."
            exit 1
          fi
          export MAESTRO_CLOUD_API_KEY
          "$HOME/.maestro/bin/maestro" cloud \
            --project-id proj_01m6fyb4qre3kvtx4jft00gvnh \
            --device-os android-33 --device-model pixel_6 \
            --name "Nexa messaging chooser ${{ github.run_id }} $(git rev-parse --short HEAD)" \
            --app-file apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            --format HTML-DETAILED \
            --output "$RUNNER_TEMP/nexa-message-maestro.html" \
            --flows "$RUNNER_TEMP/nexa-input-qa-flows" \
            2>&1 | tee "$RUNNER_TEMP/nexa-message-maestro-cli.log"
      - name: Gate on both individually passed message and input review flows
        if: always()
        run: node .maestro/validate-cloud-cli.mjs "$RUNNER_TEMP/nexa-message-maestro-cli.log" 2
      - name: Retain real UI validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexa-message-feature-maestro-evidence
          path: |
            ${{ runner.temp }}/nexa-message-maestro.html
            ${{ runner.temp }}/nexa-message-maestro-cli.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain disposable emulator launch UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexa-feature-emulator-startup
          path: |
            apps/mobile/android/nexa-startup-ui.xml
            apps/mobile/android/nexa-startup-ui.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep native instrumented failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexa-message-feature-native-diagnostics
          path: apps/mobile/android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 7
