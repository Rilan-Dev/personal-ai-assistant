name: Nexa Maestro Cloud UI acceptance (manual only)

on:
  # A manual owner comment on the designated QA PR can invoke the suite without
  # requiring a GitHub Actions dispatch API token in the ChatGPT connector.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      suite:
        description: "Which Nexa Maestro scenario to run?"
        required: true
        default: all
        type: choice
        options:
          - all
          - startup
          - wake-setup
          - overlay-settings
          - voice-safety
          - overlay-bubble
          - wake-runtime
          - screen-assist
          - resume-stress
          - agent-browser
          - agent-controls
          - whatsapp-review
      android_os:
        description: "Maestro Cloud Android image"
        required: true
        default: android-33
        type: choice
        options:
          - android-33
          - android-34
          - android-35
          - android-36
      release_run_id:
        description: "Optional successful signed Android main-promotion workflow run ID, from this exact branch"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

# A single Maestro Cloud project can cancel earlier flows when two uploads
# overlap. Queue explicit owner-requested suites; never silently cancel a
# running acceptance test to make the next test appear green.
concurrency:
  group: nexa-maestro-cloud-${{ github.repository }}
  cancel-in-progress: false

jobs:
  maestro-cloud:
    # Only the repository owner can explicitly invoke this exact QA command.
    # Other issue comments, pull requests, branches and pushes never run this job.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 29 &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'Rilan-Dev' &&
       github.event.comment.author_association == 'OWNER' &&
       (github.event.comment.body == '/nexa-maestro run all android-33' ||
        github.event.comment.body == '/nexa-maestro run agent-browser android-33' ||
        github.event.comment.body == '/nexa-maestro run agent-controls android-33' ||
        github.event.comment.body == '/nexa-maestro run whatsapp-review Development android-33'))
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Verify Maestro Cloud secret is configured
        shell: bash
        env:
          MAESTRO_CLOUD_API_KEY: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${MAESTRO_CLOUD_API_KEY:-}" ]]; then
            echo "::error::Repository secret MAESTRO_CLOUD_API_KEY is missing."
            exit 1
          fi
      # The Development checkout is allowed only for this one exact owner command.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.comment.body == '/nexa-maestro run whatsapp-review Development android-33' && 'Development' || github.ref_name }}
          fetch-depth: 0
      - name: Locate latest successful signed Nexa APK
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event_name == 'issue_comment' && github.event.comment.body == '/nexa-maestro run whatsapp-review Development android-33' && 'Development' || github.ref_name }}
          PINNED_RELEASE_RUN_ID: ${{ inputs.release_run_id || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$PINNED_RELEASE_RUN_ID" ]]; then
            if [[ ! "$PINNED_RELEASE_RUN_ID" =~ ^[0-9]{1,20}$ ]]; then
              echo "::error::Invalid signed APK run ID."
              exit 1
            fi
            selected="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$PINNED_RELEASE_RUN_ID")"
            release_id="$(jq -r '.id // empty' <<< "$selected")"
            release_sha="$(jq -r '.head_sha // empty' <<< "$selected")"
            release_branch="$(jq -r '.head_branch // empty' <<< "$selected")"
            release_path="$(jq -r '.path // empty' <<< "$selected")"
            release_conclusion="$(jq -r '.conclusion // empty' <<< "$selected")"
            if [[ "$release_branch" != "$TARGET_BRANCH" ||
                  "$release_path" != ".github/workflows/android-main-promotion.yml" ||
                  "$release_conclusion" != "success" ]]; then
              echo "::error::Pinned signed APK run must have succeeded on this exact branch."
              exit 1
            fi
          else
            runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/android-main-promotion.yml/runs?branch=$TARGET_BRANCH&status=success&per_page=10")"
            release_id="$(jq -r '.workflow_runs | map(select(.conclusion == "success")) | first | .id // empty' <<< "$runs")"
            release_sha="$(jq -r '.workflow_runs | map(select(.conclusion == "success")) | first | .head_sha // empty' <<< "$runs")"
          fi
          if [[ -z "$release_id" || ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::No matching successful signed APK release artifact run found."
            exit 1
          fi
          echo "run_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "Selected signed release run: $release_id"
      - name: Download signed release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: personal-ai-assistant-release-test-apk
          run-id: ${{ steps.release.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .maestro-release
      - name: Verify release APK hash and application source
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          file=".maestro-release/release-test-source-sha.txt"
          checksum=".maestro-release/release-test-sha256.txt"
          test -s "$file"
          test -s "$checksum"
          actual_sha="$(tr -d '\r\n' < "$file")"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::APK source provenance disagrees with the release run."
            exit 1
          fi
          apk="$(find .maestro-release -type f -name app-release.apk -print -quit)"
          test -n "$apk"
          test -s "$apk"
          expected_hash="$(awk 'NR==1 {print $1}' "$checksum")"
          actual_hash="$(sha256sum "$apk" | awk '{print $1}')"
          if [[ "$expected_hash" != "$actual_hash" ]]; then
            echo "::error::APK checksum verification failed."
            exit 1
          fi
          # Only verified signed, ancestor APKs may be reused.
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" HEAD; then
            echo "::error::Signed APK is not an ancestor of the tested branch."
            exit 1
          fi
          # Test-only scripts do not enter APK. App/runtime changes do.
          changed_source="$(git diff --name-only "$EXPECTED_SHA" HEAD -- apps/mobile packages services scripts package.json package-lock.json)"
          runtime_changes="$(printf '%s\n' "$changed_source" | grep -Ev '^scripts/test/|^$' || true)"
          if [[ -n "$runtime_changes" ]]; then
            echo "::error::Nexa app/runtime changed since signed release APK. Rebuild first."
            printf '%s\n' "$runtime_changes"
            exit 1
          fi
          echo "NEXA_RELEASE_APK=$apk" >> "$GITHUB_ENV"
          echo "Maestro tests signed release APK from $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact run: ${{ steps.release.outputs.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "APK SHA256: $actual_hash" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Maestro CLI
        shell: bash
        run: curl -fsSL https://get.maestro.mobile.dev | bash
      - name: Check strict Maestro result classifier
        run: node --test .maestro/validate-report.test.mjs .maestro/validate-cloud-cli.test.mjs
      - name: Run selected Nexa UI acceptance flow in Maestro Cloud
        shell: bash
        env:
          MAESTRO_CLOUD_API_KEY: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          MAESTRO_DISABLE_UPDATE_CHECK: "true"
          MAESTRO_CLI_NO_ANALYTICS: "true"
          TARGET_BRANCH: ${{ github.event_name == 'issue_comment' && github.event.comment.body == '/nexa-maestro run whatsapp-review Development android-33' && 'Development' || github.ref_name }}
          TEST_SUITE: ${{ github.event_name == 'issue_comment' && github.event.comment.body == '/nexa-maestro run whatsapp-review Development android-33' && 'whatsapp-review' || github.event_name == 'issue_comment' && github.event.comment.body == '/nexa-maestro run agent-browser android-33' && 'agent-browser' || github.event_name == 'issue_comment' && github.event.comment.body == '/nexa-maestro run agent-controls android-33' && 'agent-controls' || inputs.suite || 'all' }}
          ANDROID_OS: ${{ inputs.android_os || 'android-33' }}
        run: |
          set -euo pipefail
          case "$TEST_SUITE" in
            all) target=".maestro/nexa" ;;
            startup) target=".maestro/nexa/01-fresh-setup-and-navigation.yaml" ;;
            wake-setup) target=".maestro/nexa/02-hey-nexa-wake-setup.yaml" ;;
            overlay-settings) target=".maestro/nexa/03-overlay-permission-entry.yaml" ;;
            voice-safety) target=".maestro/nexa/04-voice-without-provider.yaml" ;;
            overlay-bubble) target=".maestro/nexa/05-overlay-bubble-end-to-end.yaml" ;;
            wake-runtime) target=".maestro/nexa/06-hey-nexa-model-runtime.yaml" ;;
            screen-assist) target=".maestro/nexa/07-screen-assist-settings-entry.yaml" ;;
            resume-stress) target=".maestro/nexa/08-navigation-background-resume.yaml" ;;
            agent-browser) target=".maestro/nexa/09-agent-chrome-ai-search.yaml" ;;
            agent-controls) target=".maestro/experimental/10-agent-notification-shade.yaml" ;;
            whatsapp-review) target=".maestro/experimental/11-whatsapp-owner-review.yaml" ;;
            *) echo "::error::Invalid test suite"; exit 2 ;;
          esac
          # Never print the key. GitHub secret paste often includes a trailing
          # CR or LF, which Maestro rejects inside an Authorization header.
          MAESTRO_CLOUD_API_KEY="$(printf '%s' "$MAESTRO_CLOUD_API_KEY" | tr -d '\r\n')"
          if [[ -z "$MAESTRO_CLOUD_API_KEY" || "$MAESTRO_CLOUD_API_KEY" == *[[:space:]]* ]]; then
            echo "::error::Maestro API secret contains unsupported whitespace. Update the encrypted Actions secret."
            exit 1
          fi
          export MAESTRO_CLOUD_API_KEY
          "$HOME/.maestro/bin/maestro" cloud \
            --project-id proj_01m6fyb4qre3kvtx4jft00gvnh \
            --device-os "$ANDROID_OS" \
            --device-model pixel_6 \
            --branch "$TARGET_BRANCH" \
            --name "Nexa $TEST_SUITE $ANDROID_OS $(git rev-parse --short HEAD)" \
            --app-file "$NEXA_RELEASE_APK" \
            --format HTML-DETAILED \
            --output "$RUNNER_TEMP/nexa-maestro-detailed.html" \
            --flows "$target" 2>&1 | tee "$RUNNER_TEMP/nexa-maestro-cli.log"
      - name: Validate every recorded Maestro flow independently
        if: always()
        shell: bash
        env:
          EXPECTED_FLOWS: ${{ (github.event_name == 'issue_comment' && github.event.comment.body == '/nexa-maestro run all android-33') && '12' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'all') && '12' || '1' }}
        run: node .maestro/validate-cloud-cli.mjs "$RUNNER_TEMP/nexa-maestro-cli.log" "$EXPECTED_FLOWS"
      - name: Retain detailed Maestro results and failed step evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexa-maestro-detail-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nexa-maestro-detailed.html
            ${{ runner.temp }}/nexa-maestro-cli.log
          if-no-files-found: ignore
          retention-days: 7
