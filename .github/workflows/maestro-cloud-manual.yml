name: Nexa Maestro Cloud UI acceptance (manual only)

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which Nexa Maestro scenario to run?"
        required: true
        default: all
        type: choice
        options:
          - all
          - startup
          - wake-setup
          - overlay-settings
          - voice-safety
          - overlay-bubble
          - wake-runtime
          - screen-assist
          - resume-stress
      android_os:
        description: "Maestro Cloud Android image"
        required: true
        default: android-33
        type: choice
        options:
          - android-33
          - android-34
          - android-35
          - android-36

permissions:
  contents: read
  actions: read

jobs:
  maestro-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Verify Maestro Cloud secret is configured
        shell: bash
        env:
          MAESTRO_CLOUD_API_KEY: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${MAESTRO_CLOUD_API_KEY:-}" ]]; then
            echo "::error::Repository secret MAESTRO_CLOUD_API_KEY is missing."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate latest successful signed Nexa APK
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/android-main-promotion.yml/runs?branch=main&status=success&per_page=10")"
          release_id="$(jq -r '.workflow_runs | map(select(.conclusion == "success")) | first | .id // empty' <<< "$runs")"
          release_sha="$(jq -r '.workflow_runs | map(select(.conclusion == "success")) | first | .head_sha // empty' <<< "$runs")"
          if [[ -z "$release_id" || ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::No successful Android main-promotion release artifact run found."
            exit 1
          fi
          echo "run_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "Selected signed release run: $release_id"
      - name: Download signed release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: personal-ai-assistant-release-test-apk
          run-id: ${{ steps.release.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .maestro-release
      - name: Verify release APK hash and application source
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          file=".maestro-release/release-test-source-sha.txt"
          checksum=".maestro-release/release-test-sha256.txt"
          test -s "$file"
          test -s "$checksum"
          actual_sha="$(tr -d '\r\n' < "$file")"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::APK source provenance disagrees with the release run."
            exit 1
          fi
          apk="$(find .maestro-release -type f -name app-release.apk -print -quit)"
          test -n "$apk"
          test -s "$apk"
          expected_hash="$(awk 'NR==1 {print $1}' "$checksum")"
          actual_hash="$(sha256sum "$apk" | awk '{print $1}')"
          if [[ "$expected_hash" != "$actual_hash" ]]; then
            echo "::error::APK checksum verification failed."
            exit 1
          fi
          # Test the exact release APK only if Nexa app source remains unchanged.
          # Updating Maestro tests or workflow YAML does not invalidate the APK.
          if ! git diff --quiet "$EXPECTED_SHA" HEAD -- apps/mobile packages services scripts package.json package-lock.json; then
            echo "::error::Nexa source changed after this APK. Run the Android release pipeline first."
            exit 1
          fi
          echo "NEXA_RELEASE_APK=$apk" >> "$GITHUB_ENV"
          echo "Maestro tests signed release APK from $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact run: ${{ steps.release.outputs.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "APK SHA256: $actual_hash" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Maestro CLI
        shell: bash
        run: curl -fsSL https://get.maestro.mobile.dev | bash
      - name: Run selected Nexa UI acceptance flow in Maestro Cloud
        shell: bash
        env:
          MAESTRO_CLOUD_API_KEY: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          MAESTRO_DISABLE_UPDATE_CHECK: "true"
          MAESTRO_CLI_NO_ANALYTICS: "true"
          TEST_SUITE: ${{ inputs.suite }}
          ANDROID_OS: ${{ inputs.android_os }}
        run: |
          set -euo pipefail
          case "$TEST_SUITE" in
            all) target=".maestro/nexa" ;;
            startup) target=".maestro/nexa/01-fresh-setup-and-navigation.yaml" ;;
            wake-setup) target=".maestro/nexa/02-hey-nexa-wake-setup.yaml" ;;
            overlay-settings) target=".maestro/nexa/03-overlay-permission-entry.yaml" ;;
            voice-safety) target=".maestro/nexa/04-voice-without-provider.yaml" ;;
            overlay-bubble) target=".maestro/nexa/05-overlay-bubble-end-to-end.yaml" ;;
            wake-runtime) target=".maestro/nexa/06-hey-nexa-model-runtime.yaml" ;;
            screen-assist) target=".maestro/nexa/07-screen-assist-settings-entry.yaml" ;;
            resume-stress) target=".maestro/nexa/08-navigation-background-resume.yaml" ;;
            *) echo "::error::Invalid test suite"; exit 2 ;;
          esac
          "$HOME/.maestro/bin/maestro" cloud \
            --project-id proj_01m6fyb4qre3kvtx4jft00gvnh \
            --device-os "$ANDROID_OS" \
            --device-model pixel_6 \
            --branch "$GITHUB_REF_NAME" \
            --name "Nexa $TEST_SUITE $ANDROID_OS $GITHUB_SHA" \
            --app-file "$NEXA_RELEASE_APK" \
            --flows "$target"
