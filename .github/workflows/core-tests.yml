name: Core tests
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Capture npm security audit (informational)
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          if node scripts/security/audit-summary.mjs npm-audit.json dependency-audit-summary.md; then
            cat dependency-audit-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Dependency audit could not be completed

A manual security review is required; this is not a security approval.
' | tee dependency-audit-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: |
            dependency-audit-summary.md
            npm-audit.json
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run web:export
